    <path d="M420 620v26M553 620v26"/>
  </g>
  <g stroke="#0A78CC" stroke-width="2" fill="none">
    <path d="M96 188V128M336 188V128M392 188V128M581 188V128M84 200H40M84 620H40" stroke-dasharray="4 5"/>
    <path d="M100 148h232M396 148h181M60 204v412" marker-start="url(#a)" marker-end="url(#a)"/>
  </g>
  <g fill="#0C2340" font-size="26" font-weight="700" text-anchor="middle">
    <text x="216" y="138">400</text>
    <text x="486" y="138">315</text>
    <text x="44" y="410" transform="rotate(-90 44 410)">700</text>
  </g>
  <g fill="#5E7085" font-size="20" text-anchor="middle">
    <text x="216" y="700">Вид спереди</text>
    <text x="486" y="700">Вид сбоку</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" font-family="Arial, Helvetica, sans-serif">
  <title>Габаритная схема котла Ariston ARGIS C, мм</title>
  <rect width="600" height="800" fill="#fff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#0A78CC"/>
    </marker>
  </defs>
  <g fill="#F4F9FE" stroke="#33465E" stroke-width="3" stroke-linejoin="round">
    <!-- вид спереди: 400 × 700 -->
    <rect x="96" y="200" width="240" height="420" rx="10"/>
    <rect x="128" y="520" width="176" height="64" rx="8" fill="#fff"/>
    <!-- вид сбоку: 315 × 700 -->
    <rect x="392" y="200" width="189" height="420" rx="10"/>
  </g>
  <g fill="none" stroke="#33465E" stroke-width="2.5" stroke-linecap="round">
    <circle cx="156" cy="552" r="14"/>
    <rect x="190" y="538" width="56" height="28" rx="4"/>
    <circle cx="276" cy="552" r="12"/>
